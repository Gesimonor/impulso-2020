<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpticaSoft — Panel</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f4f4f2; margin: 0; }
  header { background: #10262B; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; }
  header a { color: #fff; opacity: .8; text-decoration: none; font-size: 14px; }
  main { max-width: 500px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 26px; }
  .dato { margin-bottom: 8px; color: #444; }
  .dato b { color: #10262B; }
</style>
</head>
<body>
<header>
  <strong>OpticaSoft</strong>
  <a href="{{ url_for('logout') }}">Cerrar sesión</a>
</header>
<main>
  <h1>Hola, {{ usuario.nombre }} {{ usuario.apellido }} 👋</h1>
  <p class="dato"><b>Correo:</b> {{ usuario.correo }}</p>
  <p class="dato"><b>Rol:</b> {{ usuario.rol }}</p>
  <p class="dato"><b>ID en la base de datos:</b> {{ usuario.id }}</p>
</main>
</body>
</html>
