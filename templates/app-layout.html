<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App - Panel Principal</title>
<style>
  /* ===================================================================
     RESET GENERAL
     Quita márgenes y rellenos por defecto de todos los elementos
     =================================================================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  /* ===================================================================
     CUERPO PRINCIPAL
     display:flex hace que sidebar y main queden lado a lado
     height:100vh ocupa toda la altura de la pantalla
     =================================================================== */
  body {
    display: flex;
    height: 100vh;
    background-color: #f7f7fb;
  }

  /* ===================================================================
     BARRA LATERAL (SIDEBAR)
     La columna izquierda con el menú de navegación
     width:220px define su ancho fijo
     =================================================================== */
  .sidebar {
    width: 220px;
    background-color: #ffffff;
    border-right: 1px solid #e8e8f0;
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    box-shadow: 2px 0 8px rgba(0,0,0,0.03);
  }

  /* Logo dentro del sidebar */
  .sidebar .logo {
    text-align: center;
    font-weight: 700;
    font-size: 20px;
    color: #e8590c;
    margin-bottom: 30px;
    padding: 0 20px;
  }

  /* Contenedor de los enlaces del menú */
  .sidebar nav {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* Estilo base de cada enlace del menú */
  .sidebar a {
    text-decoration: none;
    color: #555;
    padding: 14px 24px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 4px solid transparent;
    transition: all 0.2s ease;
  }

  /* Efecto hover — cuando el mouse pasa encima */
  .sidebar a:hover {
    background-color: #fff3e6;
    color: #e8590c;
  }

  /* Enlace activo — la sección donde estás ahora */
  .sidebar a.active {
    background: linear-gradient(90deg, #fff3e6, #ffffff);
    color: #e8590c;
    border-left: 4px solid #f76707;
    font-weight: 600;
  }

  /* Contenedor del ícono de cada enlace */
  .sidebar .icon {
    width: 20px;
    text-align: center;
  }

  /* Botón de salir — siempre al fondo del sidebar */
  .sidebar .salir {
    margin-top: auto;  /* empuja el botón hasta el fondo */
    color: #d9480f;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }

  .sidebar .salir:hover {
    background-color: #ffe3e3;
  }

  /* ===================================================================
     CONTENIDO PRINCIPAL (MAIN)
     La columna derecha — ocupa todo el espacio restante
     flex:1 hace que tome todo el ancho que no usa el sidebar
     =================================================================== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===================================================================
     ENCABEZADO (HEADER)
     La barra de bienvenida con gradiente de colores
     =================================================================== */
  header {
    background: linear-gradient(120deg, #ff9a56, #ff6f91, #ffb648);
    color: white;
    padding: 24px 32px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }

  header h1 { font-size: 24px; font-weight: 700; }
  header p  { font-size: 14px; opacity: 0.9; margin-top: 4px; }

  /* ===================================================================
     ZONA DE CONTENIDO
     El área scrolleable donde van las tarjetas de cada sección
     =================================================================== */
  .content {
    flex: 1;
    padding: 32px;
    overflow-y: auto;  /* scroll vertical si el contenido es largo */
  }

  /* ===================================================================
     TARJETA (CARD)
     Contenedor blanco con sombra para mostrar información
     =================================================================== */
  .card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    color: #444;
  }

  .card h2 { color: #d9480f; margin-bottom: 10px; }
</style>
</head>
<body>

  <!-- ================================================================
       SIDEBAR — barra lateral izquierda con navegación
       ================================================================ -->
  <aside class="sidebar">

    <!-- Nombre/logo de la app -->
    <div class="logo">Mi App</div>

    <!-- Enlaces de navegación -->
    <nav>
      <a href="#" class="active"><span class="icon">🏠</span> Inicio</a>

      <a href="#"><span class="icon">🧾</span> Facturas</a>

      <a href="{{ url_for('bluep_pacientes.crear_paciente_route') }}"><span class="icon">🧑‍🤝‍🧑</span> Pacientes
      </a>

      <a href="{{ url_for('bluep_formulas.crear_formula_route') }}"><span class="icon">💊</span> Fórmulas</a>

      <a href="#"><span class="icon">📅</span> Citas</a>

      <a href="{{ url_for('logout') }}" class="salir"><span class="icon">🚪</span> Salir <!-- Botón salir — llama la función logout de Flask -->
      </a>
    </nav>

  </aside>

  <!-- ================================================================
       MAIN — contenido principal lado derecho
       ================================================================ -->
  <div class="main">

    <!-- Encabezado con bienvenida -->
    <header>
      <h1>Panel Principal</h1>
      <p>Bienvenida de nuevo, {{ usuario.nombre }} {{ usuario.apellido }}</p>
    </header>

    <!-- Zona de contenido scrolleable -->
    <div class="content">

      <!-- Tarjeta de ejemplo — aquí irá el contenido de cada sección -->
      <div class="card">
        <h2>Inicio</h2>
        <p>Aquí puedes colocar el contenido correspondiente a cada 
           sección seleccionada en el menú lateral.</p>
      </div>

    </div>
  </div>

</body>
</html>
