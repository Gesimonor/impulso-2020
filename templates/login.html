<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        /* ===================================================================
           RESET GENERAL
           Quita los márgenes/rellenos que cada navegador trae por defecto,
           y fija una sola fuente para toda la página. Es una práctica
           estándar para que tu diseño se vea igual en cualquier navegador.
           =================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
 
        /* ===================================================================
           FONDO DE PANTALLA COMPLETA
           flex + justify-content + align-items centra la tarjeta de login
           tanto horizontal como verticalmente, sin importar el tamaño de
           pantalla. La imagen de fondo se puede cambiar por la de tu óptica.
           =================================================================== */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Cambia esta URL por la imagen de fondo que prefieras */
            background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1920') no-repeat center center/cover;
            position: relative;
        }
 
        /* Capa oscura semitransparente sobre la foto de fondo, para que el
           texto blanco de la tarjeta se siga leyendo bien encima de
           cualquier imagen que uses. */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
 
        /* ===================================================================
           LA TARJETA (efecto "vidrio esmerilado" / glassmorphism)
           backdrop-filter: blur(12px) es lo que crea el efecto de vidrio
           translúcido — desenfoca lo que está detrás de la tarjeta.
           z-index: 2 la pone por encima de la capa oscura (z-index: 1).
           =================================================================== */
        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* para que también funcione en Safari */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #ffffff;
            text-align: center;
        }
 
        .logo-container { margin-bottom: 25px; }
        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
        }
 
        .login-card h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
 
        /* ===================================================================
           CADA CAMPO DEL FORMULARIO (etiqueta + input)
           =================================================================== */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .input-group input:focus {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
 
        /* Botón principal "Ingresar" */
        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            color: #333333;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .btn-submit:hover { background: #e0e0e0; transform: translateY(-2px); }
        .btn-submit:active { transform: translateY(0); }
 
        /* Enlace de "olvidé mi contraseña" debajo del formulario */
        .options { margin-top: 20px; font-size: 0.85rem; }
        .options a { color: #ffffff; text-decoration: underline; transition: opacity 0.2s; }
        .options a:hover { opacity: 0.8; }
    </style>
</head>
<body>
 
    <div class="login-card">
                <!-- Muestra errores de login -->
        {% for mensaje in get_flashed_messages() %}
            <p style="color: red;">{{ mensaje }}</p>
        {% endfor %}
 
        <!-- ============================================================
             LOGO
             Hoy apunta a un placeholder genérico (via.placeholder.com).
             Cuando tengas el logo real de la óptica, cámbialo por algo
             como src="{{ url_for('static', filename='logo.png') }}"
             (así lo verás cuando conectemos esto con Flask).
             ============================================================ -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" 
                 alt="Logo" class="logo">
        </div>
 
        <h2>Bienvenido</h2>
 
        <!-- ============================================================
             EL FORMULARIO
             action="#" y method="POST" están ahí como marcador (todavía
             no apunta a ningún lado real). Cuando lo conectemos a Flask,
             esto se vuelve: action="{{ url_for('login') }}"
             ============================================================ -->
        <form action="{{ url_for('login') }}" method="POST">
 
            <!-- CAMPO DE USUARIO/CORREO -->
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" 
                    placeholder="ejemplo@correo.com" required>
                <!-- name="email" le da el nombre al campo para que Flask lo lea -->
            </div>

            <!-- CAMPO DE CONTRASEÑA -->
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" 
                    placeholder="••••••••" required>
            </div>
 
            <!-- BOTÓN DE INGRESAR
                 type="submit" es lo que hace que, al hacer clic, se envíe
                 todo el formulario (email + password) al backend. -->
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
 
        <!-- ============================================================
             "BOTÓN" DE RESTABLECER CONTRASEÑA
             OJO: esto NO es un botón todavía, es un enlace <a> que no
             lleva a ningún lado (href="#"). Ver nota más abajo en el
             chat sobre esto — es importante que lo sepas antes de
             conectar el resto.
             ============================================================ -->
        <div class="options">
            <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
 
    </div>
 
</body>
</html>
